<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MoodWeather - 情绪天气</title>
    
    <!-- 核心 CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- 基础 JS 库 (UMD 格式最稳) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.11/babel.min.js"></script>

    <style>
        body { background: #f8fafc; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; transition: background 1s ease; }
        .spin { animation: spin 1s linear infinite; border: 3px solid #f1f5f9; border-top-color: #6366f1; border-radius: 50%; width: 28px; height: 28px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        body.weather-sunny { background: #fefce8; }
        body.weather-rainy { background: #eff6ff; }
        body.weather-storm { background: #e0e7ff; }
        body.weather-cloudy { background: #f1f5f9; }
        
        .magazine-label { font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; }
    </style>

    <script>
        window.process = { env: { API_KEY: "" } };
        window.log = (m) => {
            console.log(m);
            const d = document.getElementById('debug-console');
            if(d) d.innerHTML += `<div>> ${m}</div>`;
        };
        window.onerror = (e) => window.log("Runtime Error: " + e);
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 简易 SVG 图标组件 (替代 Lucide，确保 100% 加载) ---
        const Icon = {
            Clock: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Sparkles: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
        };

        const MOOD_CONFIGS = {
            SUNNY: { label: '晴朗', icon: '☀️', desc: '满是阳光' },
            PARTLY_CLOUDY: { label: '多云', icon: '🌤️', desc: '有些思绪' },
            CLOUDY: { label: '阴天', icon: '☁️', desc: '平淡压抑' },
            RAINY: { label: '细雨', icon: '🌧️', desc: '想静一静' },
            STORM: { label: '雷雨', icon: '⛈️', desc: '心绪难平' }
        };

        function App() {
            const [history, setHistory] = useState([]);
            const [pendingMood, setPendingMood] = useState(null);
            const [activeTab, setActiveTab] = useState('today');

            useEffect(() => {
                window.log("Init App...");
                const saved = localStorage.getItem('mood_weather_final');
                if (saved) setHistory(JSON.parse(saved));
                
                const loader = document.getElementById('initial-loader');
                if(loader) loader.style.display = 'none';
                window.log("Ready");
            }, []);

            const todayEntries = useMemo(() => {
                const today = new Date().toLocaleDateString();
                return history.filter(e => e.date === today);
            }, [history]);

            const latestMood = todayEntries.length > 0 ? todayEntries[0].type : null;

            useEffect(() => {
                const mood = pendingMood || latestMood;
                if (mood) document.body.className = `weather-${mood.toLowerCase().replace('_', '-')}`;
            }, [pendingMood, latestMood]);

            const saveMood = (type) => {
                const newEntry = {
                    id: Date.now(),
                    type,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                const updated = [newEntry, ...history].slice(0, 50);
                setHistory(updated);
                localStorage.setItem('mood_weather_final', JSON.stringify(updated));
                setPendingMood(null);
            };

            return (
                <div className="min-h-screen max-w-md mx-auto px-6 pt-16 pb-32">
                    <header className="text-center mb-16">
                        <div className="magazine-label text-indigo-400 mb-4 tracking-[0.3em]">Station v1.0</div>
                        <h1 className="text-5xl font-serif font-medium text-slate-900 transition-all duration-700">
                            {pendingMood ? '记录时刻' : (latestMood ? MOOD_CONFIGS[latestMood].label : '此刻心情')}
                        </h1>
                    </header>

                    <div className="space-y-12">
                        {/* 状态矩阵 */}
                        <div className="grid grid-cols-5 gap-3">
                            {Object.entries(MOOD_CONFIGS).map(([key, cfg]) => (
                                <button key={key} onClick={() => setPendingMood(key)} className="flex flex-col items-center">
                                    <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl transition-all
                                        ${pendingMood === key ? 'bg-white scale-110 ring-2 ring-indigo-500 shadow-xl' : 'bg-white/50 opacity-60'}`}>
                                        {cfg.icon}
                                    </div>
                                    <span className="text-[8px] mt-3 font-bold text-slate-400 uppercase">{cfg.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* 确认面板 */}
                        {pendingMood && (
                            <div className="bg-white/90 p-8 rounded-[2.5rem] shadow-2xl text-center space-y-6">
                                <p className="text-slate-500 text-sm italic">"{MOOD_CONFIGS[pendingMood].desc}"</p>
                                <div className="flex gap-4 justify-center">
                                    <button onClick={() => setPendingMood(null)} className="w-12 h-12 rounded-full border border-slate-200 flex items-center justify-center text-slate-300"><Icon.X/></button>
                                    <button onClick={() => saveMood(pendingMood)} className="h-12 px-8 rounded-full bg-slate-900 text-white font-bold text-xs tracking-widest flex items-center gap-2">
                                        <Icon.Check/> 同步
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 今日时间线 */}
                        {!pendingMood && todayEntries.length > 0 && (
                            <div className="bg-white/40 p-8 rounded-[2.5rem] border border-white/60">
                                <div className="magazine-label text-slate-400 mb-6 flex items-center gap-2">
                                    <Icon.Clock/> 今日流
                                </div>
                                <div className="flex gap-6 overflow-x-auto pb-2 hide-scrollbar">
                                    {todayEntries.map(e => (
                                        <div key={e.id} className="flex flex-col items-center flex-shrink-0">
                                            <div className="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-2xl mb-2">
                                                {MOOD_CONFIGS[e.type].icon}
                                            </div>
                                            <span className="text-[10px] font-bold text-slate-400">{e.time}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 导航栏 */}
                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[85%] max-w-xs glass rounded-full p-2 flex gap-1 shadow-2xl z-50">
                        {['today', 'trends', 'report'].map(tab => (
                            <button key={tab} onClick={() => setActiveTab(tab)}
                                className={`flex-1 py-3 text-[9px] font-black uppercase tracking-widest rounded-full transition-all
                                ${activeTab === tab ? 'bg-white text-slate-900 shadow-md' : 'text-slate-400'}`}>
                                {tab === 'today' ? '实时' : (tab === 'trends' ? '趋势' : '报告')}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        try {
            ReactDOM.render(<App />, document.getElementById('root'));
        } catch(e) { window.log("Render Fail: " + e); }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
    <div id="initial-loader" style="position: fixed; inset: 0; background: #f8fafc; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">
        <div class="spin"></div>
        <p class="magazine-label" style="color: #6366f1;">Initializing</p>
        <div id="retry-hint" style="display:none; text-align: center;">
            <button onclick="location.reload(true)" style="font-size: 11px; color: #94a3b8; background: white; border: 1px solid #e2e8f0; padding: 10px 20px; border-radius: 20px;">
                正在尝试重连...
            </button>
            <div id="debug-console" style="margin-top: 20px; font-family: monospace; font-size: 9px; color: #cbd5e1; max-width: 80vw; text-align: left; overflow-wrap: break-word;"></div>
        </div>
    </div>
    <div id="root"></div>
    <script>
        setTimeout(() => {
            const h = document.getElementById('retry-hint');
            if(h) h.style.display = 'block';
        }, 6000);
    </script>
</body>
</html>
