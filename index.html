<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MoodWeather - 情绪天气预报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-bg: #f8fafc;
        }
        body { 
            background: var(--app-bg);
            margin: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .font-serif { font-family: 'Noto Serif SC', serif; }
        
        /* 动态天气背景主题 */
        .weather-sunny { --app-bg: #fffbeb; background-color: #fffbeb; }
        .weather-partly-cloudy { --app-bg: #f0f9ff; background-color: #f0f9ff; }
        .weather-cloudy { --app-bg: #f1f5f9; background-color: #f1f5f9; }
        .weather-rainy { --app-bg: #eff6ff; background-color: #eff6ff; }
        .weather-storm { --app-bg: #eef2ff; background-color: #eef2ff; }
        .weather-hazy { --app-bg: #f5f5f4; background-color: #f5f5f4; }
        .weather-windy { --app-bg: #f0fdfa; background-color: #f0fdfa; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .magazine-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes w-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes w-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes w-rain { 0% { transform: translateY(-5px); opacity: 0.5; } 50% { transform: translateY(5px); opacity: 1; } 100% { transform: translateY(-5px); opacity: 0.5; } }
        @keyframes w-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
        
        .animate-w-spin { animation: w-spin 20s linear infinite; }
        .animate-w-float { animation: w-float 4s ease-in-out infinite; }
        .animate-w-rain { animation: w-rain 2s ease-in-out infinite; }
        .animate-w-shake { animation: w-shake 0.5s ease-in-out infinite; }
        .animate-spin-slow { animation: w-spin 8s linear infinite; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "recharts": "https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@1.2.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
