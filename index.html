<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MoodWeather - 情绪天气</title>
    
    <!-- 基础样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- 核心 UMD 依赖 (比 ESM 模块更稳定) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.11/babel.min.js"></script>
    
    <!-- 备用加载 SDK -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.sh/@google/genai@1.35.0";
        window.GoogleGenAI = GoogleGenAI;
    </script>

    <style>
        body { background: #f8fafc; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .spin { animation: spin 1s linear infinite; border: 3px solid #f1f5f9; border-top-color: #6366f1; border-radius: 50%; width: 28px; height: 28px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        body.weather-sunny { background: #fefce8; }
        body.weather-rainy { background: #eff6ff; }
        body.weather-storm { background: #e0e7ff; }
        body.weather-cloudy { background: #f1f5f9; }
        
        .mood-card { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .magazine-label { font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; }
    </style>

    <script>
        // 环境模拟
        window.process = { env: { API_KEY: "" } };
        
        // 自动清理旧缓存
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }

        // 诊断逻辑
        window.log = (msg) => {
            const consoleEl = document.getElementById('debug-console');
            if(consoleEl) consoleEl.innerHTML += `<div>> ${msg}</div>`;
            console.log(msg);
        };

        window.onerror = (e) => window.log("Error: " + e);
    </script>

    <script type="text/babel">
        // 从全局变量解构 (UMD 方式)
        const { useState, useEffect, useMemo } = React;
        const { 
            Sun, Cloud, CloudRain, Zap, Clock, Sparkles, Check, X, Calendar, MessageSquare, Quote 
        } = lucide;

        const MOOD_CONFIGS = {
            SUNNY: { label: '晴朗', icon: '☀️', color: 'bg-yellow-400', desc: '心情大好，满是阳光' },
            PARTLY_CLOUDY: { label: '多云', icon: '🌤️', color: 'bg-blue-300', desc: '总体不错，有些思绪' },
            CLOUDY: { label: '阴天', icon: '☁️', color: 'bg-gray-400', desc: '情绪平平，略显压抑' },
            RAINY: { label: '细雨', icon: '🌧️', color: 'bg-blue-500', desc: '有些感伤，想静一静' },
            STORM: { label: '雷雨', icon: '⛈️', color: 'bg-indigo-700', desc: '压力山大，心绪难平' }
        };

        function App() {
            const [history, setHistory] = useState([]);
            const [pendingMood, setPendingMood] = useState(null);
            const [insight, setInsight] = useState('');
            const [activeTab, setActiveTab] = useState('today');

            useEffect(() => {
                window.log("App Mounting...");
                const saved = localStorage.getItem('mood_weather_v5');
                if (saved) setHistory(JSON.parse(saved));
                
                // 隐藏启动动画
                const loader = document.getElementById('initial-loader');
                if(loader) loader.style.display = 'none';
                window.log("App Ready");
            }, []);

            const todayEntries = useMemo(() => {
                const today = new Date().toLocaleDateString();
                return history.filter(e => e.date === today);
            }, [history]);

            const latestMood = todayEntries.length > 0 ? todayEntries[0].type : null;

            useEffect(() => {
                const mood = pendingMood || latestMood;
                if (mood) document.body.className = `weather-${mood.toLowerCase().replace('_', '-')}`;
            }, [pendingMood, latestMood]);

            const saveMood = (type) => {
                const newEntry = {
                    id: Date.now(),
                    type,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                };
                const updated = [newEntry, ...history].slice(0, 50);
                setHistory(updated);
                localStorage.setItem('mood_weather_v5', JSON.stringify(updated));
                setPendingMood(null);
                
                // 模拟 AI 洞察
                const insights = ["每一片云朵都有它的意义。", "感受当下的宁静。", "不论晴雨，你是你自己的中心。"];
                setInsight(insights[Math.floor(Math.random()*insights.length)]);
            };

            return (
                <div className="min-h-screen max-w-md mx-auto px-6 pt-12 pb-32 overflow-x-hidden">
                    <header className="text-center mb-16 animate-in fade-in duration-1000">
                        <div className="magazine-label text-indigo-400 mb-4 tracking-[0.3em]">Meteorological Station</div>
                        <h1 className="text-5xl font-serif font-medium text-slate-900 transition-all duration-700">
                            {pendingMood ? '记录此刻' : (latestMood ? MOOD_CONFIGS[latestMood].label : '此刻心情')}
                        </h1>
                    </header>

                    <main className="space-y-12">
                        {/* 状态选择 */}
                        <div className="grid grid-cols-5 gap-3">
                            {Object.entries(MOOD_CONFIGS).map(([key, cfg]) => (
                                <button key={key} onClick={() => setPendingMood(key)} className="flex flex-col items-center">
                                    <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl transition-all duration-500 shadow-sm
                                        ${pendingMood === key ? 'bg-white scale-125 ring-2 ring-indigo-500 shadow-xl' : 'bg-white/50 opacity-60'}`}>
                                        {cfg.icon}
                                    </div>
                                    <span className="text-[8px] mt-3 font-bold text-slate-400 uppercase tracking-tighter">{cfg.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* 确认面板 */}
                        {pendingMood && (
                            <div className="animate-in zoom-in-95 bg-white/90 p-8 rounded-[2.5rem] shadow-2xl text-center space-y-6">
                                <p className="text-slate-500 text-sm italic">"{MOOD_CONFIGS[pendingMood].desc}"</p>
                                <div className="flex gap-4 justify-center">
                                    <button onClick={() => setPendingMood(null)} className="w-12 h-12 rounded-full border border-slate-200 flex items-center justify-center text-slate-300"><X size={20}/></button>
                                    <button onClick={() => saveMood(pendingMood)} className="h-12 px-8 rounded-full bg-slate-900 text-white font-bold text-xs tracking-widest flex items-center gap-2">
                                        <Check size={16}/> 同步气象
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 记录流 */}
                        {!pendingMood && todayEntries.length > 0 && (
                            <div className="bg-white/40 p-8 rounded-[2.5rem] border border-white/60 shadow-sm">
                                <div className="magazine-label text-slate-400 mb-6 flex items-center gap-2">
                                    <div className="w-1 h-1 bg-indigo-400 rounded-full animate-pulse"></div> 今日气象流
                                </div>
                                <div className="flex gap-6 overflow-x-auto pb-2 hide-scrollbar">
                                    {todayEntries.map(e => (
                                        <div key={e.id} className="flex flex-col items-center flex-shrink-0 animate-in slide-in-from-right-4">
                                            <div className="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-2xl mb-2">
                                                {MOOD_CONFIGS[e.type].icon}
                                            </div>
                                            <span className="text-[10px] font-bold text-slate-400">{e.time}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* AI 洞察 */}
                        {!pendingMood && (insight || todayEntries.length > 0) && (
                            <div className="bg-slate-900 rounded-[2.5rem] p-10 text-white relative overflow-hidden group shadow-2xl">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>
                                <p className="text-xl font-serif italic leading-relaxed opacity-90 relative z-10">
                                    “{insight || "记录下每一个微妙的变化，它们构成了你独特的情绪气候。"}”
                                </p>
                                <div className="mt-8 flex items-center gap-3 opacity-50">
                                    <div className="h-px flex-1 bg-white/20"></div>
                                    <div className="magazine-label text-[8px] tracking-[0.3em]">AI Daily Report</div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 底部导航 */}
                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[85%] max-w-xs glass rounded-full p-2 flex gap-1 shadow-2xl z-50">
                        {['today', 'trends', 'report'].map(tab => (
                            <button key={tab} onClick={() => setActiveTab(tab)}
                                className={`flex-1 py-3 text-[9px] font-black uppercase tracking-widest rounded-full transition-all
                                ${activeTab === tab ? 'bg-white text-slate-900 shadow-md scale-[1.02]' : 'text-slate-400'}`}>
                                {tab === 'today' ? '实时' : (tab === 'trends' ? '趋势' : '报告')}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <!-- 初始加载层 -->
    <div id="initial-loader" style="position: fixed; inset: 0; background: #f8fafc; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">
        <div class="spin"></div>
        <p class="magazine-label" style="color: #6366f1;">Atmosphere Syncing</p>
        
        <!-- 自动重试/诊断按钮 (10秒后显示) -->
        <div id="retry-hint" style="display:none; text-align: center; margin-top: 20px;">
            <button onclick="location.reload(true)" style="font-size: 11px; color: #94a3b8; background: white; border: 1px solid #e2e8f0; padding: 10px 20px; border-radius: 20px;">
                加载时间较长，点此刷新
            </button>
            <div id="debug-console" style="margin-top: 20px; font-family: monospace; font-size: 10px; color: #cbd5e1; max-width: 80vw; text-align: left;"></div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        setTimeout(() => {
            const hint = document.getElementById('retry-hint');
            if(hint) hint.style.display = 'block';
            window.log("Timeout trigger check");
        }, 8000);
    </script>
</body>
</html>
