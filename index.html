<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>MoodWeather - 情绪天气</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- ES Module Shims: 兼容性补丁 -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.11/babel.min.js"></script>

    <style>
        body { background: #f8fafc; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .spin { animation: spin 1s linear infinite; border: 3px solid #f1f5f9; border-top-color: #6366f1; border-radius: 50%; width: 24px; height: 24px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
        window.process = { env: { API_KEY: "" } };
        
        // 强力清除旧环境缓存
        (async () => {
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for(let r of regs) await r.unregister();
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                for(let k of keys) await caches.delete(k);
            }
        })();

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `<div style="padding:40px; color:#ef4444; font-size:12px;">
                    <h3 style="font-weight:bold">运行异常</h3>
                    <p>${msg}</p>
                    <button onclick="location.reload(true)" style="margin-top:20px; background:#6366f1; color:white; padding:10px 20px; border-radius:8px; border:none;">尝试重载</button>
                </div>`;
            }
            return false;
        };

        window.loadTimer = setTimeout(() => {
            const retryBtn = document.getElementById('retry-btn');
            if (retryBtn) retryBtn.style.opacity = '1';
        }, 6000);
    </script>

    <script type="text/babel" data-type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import App from './App.tsx';

        try {
            clearTimeout(window.loadTimer);
            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
            console.log("App mounted");
        } catch (e) {
            console.error("Mount error:", e);
            throw e;
        }
    </script>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
            <div class="spin"></div>
            <p style="font-size: 10px; font-weight: 800; color: #6366f1; letter-spacing: 0.2em; text-transform: uppercase;">Atmosphere Syncing</p>
            <button id="retry-btn" onclick="location.reload(true)" style="opacity:0; transition: opacity 0.5s; font-size: 12px; color: #94a3b8; background: none; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 20px;">
                加载较慢？点击重试
            </button>
        </div>
    </div>
</body>
</html>
