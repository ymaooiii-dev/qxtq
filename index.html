<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>MoodWeather - 情绪天气</title>
    
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- ES Module Shims: 让旧版安卓也支持 importmap -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.11/babel.min.js"></script>

    <style>
        body { background: #f8fafc; margin: 0; font-family: sans-serif; }
        .spin { animation: spin 1s linear infinite; border: 3px solid #f1f5f9; border-top-color: #6366f1; border-radius: 50%; width: 24px; height: 24px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #debug-log { position: fixed; bottom: 0; left: 0; width: 100%; font-size: 10px; color: #94a3b8; padding: 10px; pointer-events: none; max-height: 50px; overflow: hidden; }
    </style>

    <script>
        window.process = { env: { API_KEY: "" } };
        
        // 暴力清理坏掉的 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
                for(let reg of regs) reg.unregister().then(() => console.log("Cleared old SW"));
            });
        }

        // 简单的日志捕获，显示在屏幕底部
        function logToScreen(msg) {
            const el = document.getElementById('debug-log');
            if (el) el.innerText = "System: " + msg;
            console.log(msg);
        }

        window.onerror = (m) => logToScreen("Error: " + m);
        
        window.loadTimer = setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.innerText.includes('SYNCING')) {
                logToScreen("加载超时，尝试点击下方重置");
                document.getElementById('retry-btn').style.display = 'block';
            }
        }, 10000);

        async function forceReset() {
            localStorage.clear();
            const keys = await caches.keys();
            for(let k of keys) await caches.delete(k);
            location.reload(true);
        }
    </script>

    <script type="text/babel" data-type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import App from './App.tsx';

        try {
            if (window.loadTimer) clearTimeout(window.loadTimer);
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            console.log("React Rendered Successfully");
        } catch (e) {
            document.body.innerHTML += '<div style="color:red; padding:20px;">Render Error: ' + e.message + '</div>';
        }
    </script>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
            <div class="spin"></div>
            <p style="font-size: 10px; font-weight: 700; color: #6366f1; letter-spacing: 0.1em;">ATMOSPHERE SYNCING</p>
            <button id="retry-btn" onclick="forceReset()" style="display:none; margin-top: 20px; font-size: 12px; color: #6366f1; border: 1px solid #6366f1; padding: 8px 16px; border-radius: 8px;">一键修复加载错误</button>
        </div>
    </div>
    <div id="debug-log">Initialing environment...</div>
</body>
</html>
